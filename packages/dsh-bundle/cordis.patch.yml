# @sophia/dsh-bundle — the second bundle layer of the `sophia-runtime` profile,
# applied after @deepseek-ai/dsh-base (pin 639ed015 / 0.2.0-rc.2).
#
# Every `id:` row below targets a row that dsh-base inserts at the pin
# [DSH-04]. scripts/lib/patch-lint.mjs fails the build when a target is
# missing, because upstream only prints a warning for an unmatched row and
# boots anyway. It also fails an empty or comments-only file. Every row the
# base inserts is listed, with its package, in
# config/dsh/base-rows.reviewed.json; an unreviewed new or renamed base row
# fails the gate (SMC-M02).
#
# A replacement `config` replaces the WHOLE row config (no deep merge). Any
# future config replacement on a base row must restate the complete config.

# Outbound DeepSeek session-log upload, plugin inventory and OTel feedback
# export are distinct from model input, so they are disabled here, not by a
# prompt rule (02_DSH_BOOTSTRAP §6). The launcher also receives
# DSH_TELEMETRY_DISABLED=1; any non-empty value opts out.
- id: session-log-deepseek
  disabled: true

- id: plugin-package-inventory-deepseek
  disabled: true

- id: session-telemetry-otel
  disabled: true

# The OTel host (dsh-base since 0.2.0-rc.1). Mounting it creates no transport
# by itself, and its only base consumer is session-telemetry-otel above. It
# is disabled anyway, so a future consumer cannot export through it
# (SMC-M02, M02 §5.3).
- id: otel
  disabled: true

# DeepSeek account login and its model route (dsh-base since 0.1.7-rc.2).
# Sophia uses no DeepSeek account: the development route is OpenAI below, and
# the D13 release baseline uses the API-key route (llm-deepseek). Disabled so
# no account credential surface loads (SMC-M02, decision D3).
- id: llm-deepseek-account
  disabled: true

# No live reload in the shipped profile. Upgrades happen at a runtime-unit
# boundary.
- id: hmr
  disabled: true

# No extra model call per session to title it. Worker sessions need no title,
# and the call would send the first prompt to the provider a second time. The
# dsh SDK bundle disables the same row.
- id: session-title-llm
  disabled: true

# Development model route (owner choice, 2026-09-24): OpenAI GPT-6 Luna at
# high reasoning through the pi-ai adapter [DSH-15]. Decision D13's release
# baseline (deepseek-official / deepseek-flash) is unchanged; switching back is
# a change to these two rows plus a new recorded runtime unit.
#
# pi-ai 0.85.1 (the 0.1.7 and 0.2.0-rc.1 units) shipped no gpt-6-luna, so the
# route's `models` list declares it, with values copied from the pi-ai 0.87.1
# catalog entry. At this pin dsh depends on pi-ai 0.87.1, which ships the
# entry itself, and dsh lays each declared entry over the installed catalog
# entry. The request-shape parity test (tests/integration/request-shape.test.mjs)
# holds the wire request to the previous unit's shape; `compat` below is what
# that needed. The key is a reference: dsh resolves OPENAI_API_KEY per request
# and the value never enters configuration. Without it, a request fails with
# MISSING_CREDENTIAL instead of silently switching provider.
- id: llm-pi-ai
  config:
    providers:
      openai:
        apiKeyEnv: OPENAI_API_KEY
        api: openai-responses
        defaultMaxTokens: 128000
        models:
          - id: gpt-6-luna
            name: GPT-6 Luna
            contextWindow: 272000
            input: [text, image]
            reasoningEfforts:
              off: none
              low: low
              medium: medium
              high: high
              xhigh: xhigh
              max: max
            # Pins the previous unit's request shape (SMC-M02 R1): pi-ai
            # 0.87.1's catalog entry turns strict mode on, which sends
            # `strict: false` on every tool; the previous unit sent no
            # `strict` field. This is the only route difference the parity
            # test found, and the only compat switch dsh lets a route set
            # that it touches.
            compat:
              supportsStrictMode: false
      # Research route (SMC-M03, owner decisions D1 and D2): GPT-6.1 Sol at
      # medium reasoning on a dedicated OpenAI project whose key carries a
      # provider-side hard budget, so research spend never shares the
      # development key. pi-ai 0.87.1 (this pin) ships no gpt-6.1-sol, so the
      # entry is declared here with values from the pi-ai 0.99.2 catalog; the
      # route is not a catalog provider, so it names its protocol and endpoint.
      # - maxTokens caps every request's output at 16000 tokens, which bounds
      #   the worst case a reservation must cover.
      # - contextWindow 272000 keeps every request in the cheaper price tier.
      # - cacheRetention stays unset ("short"): the prompt cache key is the
      #   native session id and nothing else is sent. supportsLongCacheRetention
      #   false makes a "long" setting send nothing instead of the
      #   prompt_cache_retention field this model refuses.
      # - supportsStrictMode true matches the catalog: every tool carries
      #   `strict: false`.
      openai-research:
        displayName: OpenAI (research)
        apiKeyEnv: OPENAI_RESEARCH_API_KEY
        api: openai-responses
        baseURL: https://api.openai.com/v1
        defaultMaxTokens: 16000
        models:
          - id: gpt-6.1-sol
            name: GPT-6.1 Sol
            contextWindow: 272000
            maxTokens: 16000
            input: [text, image]
            reasoningEfforts:
              low: low
              medium: medium
              high: high
              xhigh: xhigh
              max: max
            compat:
              supportsStrictMode: true
              supportsLongCacheRetention: false

# Compaction (SMC-M03, decision D9): the research route compacts at 45% of its
# window instead of 80%, so a long research session stays cheap per request and
# a summary call fits one reservation (8000 output tokens). Every other route
# keeps dsh-base's defaults: the row had no config, and none is restated.
- id: compaction-basic
  config:
    modelPolicies:
      - provider: openai-research
        model: gpt-6.1-sol
        thresholdRatio: 0.45
        headroomTokens: 16000
        maxTokens: 8000

# Every Agent the bridge creates starts on that route. This restates the row's
# whole config, including the reasoning effort.
- id: agent-default-model
  config:
    provider: openai
    model: gpt-6-luna
    reasoningEffort: high

# Native presets (SMC-M02 G3): one per Sophia role, mounted by the control
# bridge through the public `agentPresets` registry when it creates or resumes
# an attempt [DSH-25]. Each preset carries the role's identity and composes
# no plugin: a role's tools are the base registrations the bridge restricts
# and guards per role. The bridge records each attempt's preset with a digest
# of its definition and refuses to resume one whose definition changed. The
# registry's `default` is never used by the bridge, which always names the
# role; it is set to the tool-less brief role so that any other caller gets
# the least. scripts/lib/gate.mjs requires exactly this roster, unbroadened.
- insert:
    - id: agent-preset-registry
      name: '@deepseek-ai/dsh-agent-preset-registry'
      config:
        default: sophia-brief-v1
    - id: preset-sophia-guide-v1
      name: '@deepseek-ai/dsh-agent-preset'
      config:
        id: sophia-guide-v1
        plugins: []
    - id: preset-sophia-lead-v1
      name: '@deepseek-ai/dsh-agent-preset'
      config:
        id: sophia-lead-v1
        plugins: []
    - id: preset-sophia-research-v1
      name: '@deepseek-ai/dsh-agent-preset'
      config:
        id: sophia-research-v1
        plugins: []
    - id: preset-sophia-prototype-v1
      name: '@deepseek-ai/dsh-agent-preset'
      config:
        id: sophia-prototype-v1
        plugins: []
    - id: preset-sophia-review-v1
      name: '@deepseek-ai/dsh-agent-preset'
      config:
        id: sophia-review-v1
        plugins: []
    - id: preset-sophia-brief-v1
      name: '@deepseek-ai/dsh-agent-preset'
      config:
        id: sophia-brief-v1
        plugins: []
    # SMC-M03 research specializations. Identity only until their research
    # tools exist (S4); the PDF one later also composes the renderer's tools.
    - id: preset-sophia-research-md-v1
      name: '@deepseek-ai/dsh-agent-preset'
      config:
        id: sophia-research-md-v1
        plugins: []
    - id: preset-sophia-research-pdf-v1
      name: '@deepseek-ai/dsh-agent-preset'
      config:
        id: sophia-research-pdf-v1
        plugins: []
    # SDD-01 native design roles: the HTML designer and the separate visual
    # reviewer. Identity only, like the rest: the bridge registers each role's
    # design or review tools in the agent's own scope and installs its prompt
    # sections and native skills from the bundle's verified skills/ files.
    - id: preset-sophia-html-designer-v1
      name: '@deepseek-ai/dsh-agent-preset'
      config:
        id: sophia-html-designer-v1
        plugins: []
    - id: preset-sophia-visual-review-v1
      name: '@deepseek-ai/dsh-agent-preset'
      config:
        id: sophia-visual-review-v1
        plugins: []

# Sophia's control bridge (S1-03). The plugin itself declares its service
# injections (agents, sessions, tools). The config names environment
# variables the execution-host supervisor sets. It holds no URL or secret:
# without a service binding the bridge stays `not_ready`.
#
# `routes` is the unit's route allowlist beyond `default` (the
# agent-default-model selection above), by immutable route id; `roleRoutes`
# gives a role its route (SMC-M03). A role not named runs on `default`. The
# bridge records the route in each attempt's identity, refuses a create that
# names another route, and refuses any model call of the attempt (its
# children's and its compaction's too) on another route. There is no fallback.
- insert:
    - id: sophia-control-bridge
      name: '@sophia/dsh-bundle'
      config:
        protocolVersion: 1
        serviceUrlEnv: SOPHIA_BRIDGE_URL
        tokenEnv: SOPHIA_BRIDGE_TOKEN
        runtimeUnitEnv: SOPHIA_RUNTIME_UNIT
        workspaceEnv: SOPHIA_WORKSPACE
        routes:
          research-sol-medium-v1:
            provider: openai-research
            model: gpt-6.1-sol
            reasoningEffort: medium
            maxTokens: 16000
            # USD per million tokens (the unit's prices): every call on this route is reserved from the
            # research allowance before it leaves and settled from its usage (SMC-M03 S4).
            prices:
              input: 2
              cacheRead: 0.1
              cacheWrite: 2.5
              output: 10
        # The design roles (SDD-01) run on the research route, which declares image input; their calls are metered
        # against the research lineage's allowance through the design operations.
        roleRoutes:
          sophia-research-md-v1: research-sol-medium-v1
          sophia-research-pdf-v1: research-sol-medium-v1
          sophia-html-designer-v1: research-sol-medium-v1
          sophia-visual-review-v1: research-sol-medium-v1
        # The research providers' keys, by reference (the unit's research_sources); never an endpoint override.
        sources:
          tavilyKeyEnv: TAVILY_API_KEY
          jinaKeyEnv: JINA_API_KEY
