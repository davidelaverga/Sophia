# @sophia/dsh-bundle — the second bundle layer of the `sophia-runtime` profile,
# applied after @deepseek-ai/dsh-base (pin 639ed015 / 0.2.0-rc.2).
#
# Every `id:` row below targets a row that dsh-base inserts at the pin
# [DSH-04]. scripts/lib/patch-lint.mjs fails the build when a target is
# missing, because upstream only prints a warning for an unmatched row and
# boots anyway. It also fails an empty or comments-only file. Every row the
# base inserts is listed, with its package, in
# config/dsh/base-rows.reviewed.json; an unreviewed new or renamed base row
# fails the gate (SMC-M02).
#
# A replacement `config` replaces the WHOLE row config (no deep merge). Any
# future config replacement on a base row must restate the complete config.

# Outbound DeepSeek session-log upload, plugin inventory and OTel feedback
# export are distinct from model input, so they are disabled here, not by a
# prompt rule (02_DSH_BOOTSTRAP §6). The launcher also receives
# DSH_TELEMETRY_DISABLED=1; any non-empty value opts out.
- id: session-log-deepseek
  disabled: true

- id: plugin-package-inventory-deepseek
  disabled: true

- id: session-telemetry-otel
  disabled: true

# The OTel host (dsh-base since 0.2.0-rc.1). Mounting it creates no transport
# by itself, and its only base consumer is session-telemetry-otel above. It
# is disabled anyway, so a future consumer cannot export through it
# (SMC-M02, M02 §5.3).
- id: otel
  disabled: true

# DeepSeek account login and its model route (dsh-base since 0.1.7-rc.2).
# Sophia uses no DeepSeek account: the development route is OpenAI below, and
# the D13 release baseline uses the API-key route (llm-deepseek). Disabled so
# no account credential surface loads (SMC-M02, decision D3).
- id: llm-deepseek-account
  disabled: true

# No live reload in the shipped profile. Upgrades happen at a runtime-unit
# boundary.
- id: hmr
  disabled: true

# No extra model call per session to title it. Worker sessions need no title,
# and the call would send the first prompt to the provider a second time. The
# dsh SDK bundle disables the same row.
- id: session-title-llm
  disabled: true

# Development model route (owner choice, 2026-09-24): OpenAI GPT-6 Luna at
# high reasoning through the pi-ai adapter [DSH-15]. Decision D13's release
# baseline (deepseek-official / deepseek-flash) is unchanged; switching back is
# a change to these two rows plus a new recorded runtime unit.
#
# pi-ai 0.85.1 (the 0.1.7 and 0.2.0-rc.1 units) shipped no gpt-6-luna, so the
# route's `models` list declares it, with values copied from the pi-ai 0.87.1
# catalog entry. At this pin dsh depends on pi-ai 0.87.1, which ships the
# entry itself, and dsh lays each declared entry over the installed catalog
# entry. The request-shape parity test (tests/integration/request-shape.test.mjs)
# holds the wire request to the previous unit's shape; `compat` below is what
# that needed. The key is a reference: dsh resolves OPENAI_API_KEY per request
# and the value never enters configuration. Without it, a request fails with
# MISSING_CREDENTIAL instead of silently switching provider.
- id: llm-pi-ai
  config:
    providers:
      openai:
        apiKeyEnv: OPENAI_API_KEY
        api: openai-responses
        defaultMaxTokens: 128000
        models:
          - id: gpt-6-luna
            name: GPT-6 Luna
            contextWindow: 272000
            input: [text, image]
            reasoningEfforts:
              off: none
              low: low
              medium: medium
              high: high
              xhigh: xhigh
              max: max
            # Pins the previous unit's request shape (SMC-M02 R1): pi-ai
            # 0.87.1's catalog entry turns strict mode on, which sends
            # `strict: false` on every tool; the previous unit sent no
            # `strict` field. This is the only route difference the parity
            # test found, and the only compat switch dsh lets a route set
            # that it touches.
            compat:
              supportsStrictMode: false

# Every Agent the bridge creates starts on that route. This restates the row's
# whole config, including the reasoning effort.
- id: agent-default-model
  config:
    provider: openai
    model: gpt-6-luna
    reasoningEffort: high

# Sophia's control bridge (S1-03). The plugin itself declares its service
# injections (agents, sessions, tools). The config names environment
# variables the execution-host supervisor sets. It holds no URL or secret:
# without a service binding the bridge stays `not_ready`.
- insert:
    - id: sophia-control-bridge
      name: '@sophia/dsh-bundle'
      config:
        protocolVersion: 1
        serviceUrlEnv: SOPHIA_BRIDGE_URL
        tokenEnv: SOPHIA_BRIDGE_TOKEN
        runtimeUnitEnv: SOPHIA_RUNTIME_UNIT
        workspaceEnv: SOPHIA_WORKSPACE
