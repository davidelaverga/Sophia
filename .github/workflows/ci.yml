# S1-01 gate: every push proves a clean checkout reproduces the recorded
# runtime unit (lock, runtime artifact digest, bundle archive, profile lock)
# and that the composition gate rejects each adverse case.
# S1-02 adds the schema, persistence and HTTP suites on a real PostgreSQL 16,
# and the auth crossing against a local Supabase stack.
name: ci

on:
  push:
  pull_request:

permissions:
  contents: read

# One run per branch at a time. A push and the pull request it updates share a group (the branch's name), so a later
# run cancels the one it supersedes. main keeps every run: each commit there is a group of its own, since a group
# without cancel-in-progress still drops a run left pending behind a newer one.
concurrency:
  group: ci-${{ github.head_ref || (github.ref_name == 'main' && github.sha) || github.ref_name }}
  cancel-in-progress: ${{ github.ref_name != 'main' }}

jobs:
  runtime-unit:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0 (reads packageManager)
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version-file: .node-version
      - run: pnpm install --frozen-lockfile
      - run: pnpm check
      - name: Pinned dsh source and release provenance
        run: pnpm dsh:source --dir "$RUNNER_TEMP/dsh-src/deepseek-harness" --verify-release

  renderer:
    name: Confined PDF renderer on a real Chromium
    runs-on: ubuntu-24.04
    # On 2026-10-07 the browser's install took 7.6 and 10.0 minutes and the kernels 5.2: 15 cut off kernels still
    # passing.
    timeout-minutes: 30
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_PASSWORD: ci
        ports: ['5432:5432']
        options: >-
          --health-cmd "pg_isready -U postgres"
          --health-interval 5s --health-timeout 5s --health-retries 10
    env:
      # A skipped browser test fails here: this job exists to run them.
      SOPHIA_RENDERER_REQUIRED: '1'
      SOPHIA_DISPOSABLE_DATABASE_URL: postgres://postgres:ci@localhost:5432/postgres
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0 (reads packageManager)
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version-file: .node-version
      - run: pnpm install --frozen-lockfile
      # Ubuntu 24.04 restricts unprivileged user namespaces through AppArmor. The renderer needs them for its own
      # namespaces and for Chromium's sandbox, so the restriction is lifted on this runner. Nothing adds a
      # no-sandbox path: the tests assert the sandbox is active and fail if it is not.
      - name: Allow unprivileged user namespaces
        run: |
          if [ -e /proc/sys/kernel/apparmor_restrict_unprivileged_userns ]; then
            sudo sysctl -w kernel.apparmor_restrict_unprivileged_userns=0
          fi
      # The headless shell playwright-core 1.56.1 pins (its browsers.json), with its system libraries.
      - run: node renderers/web/pdf/node_modules/playwright-core/cli.js install --with-deps chromium-headless-shell
      # The PDF kernel, the capture kernel (SDD-01) and the host probe, which qualifies both.
      - run: node --test --test-timeout=120000 renderers/web/pdf/test/render-html.test.ts renderers/web/pdf/test/capture-html.test.ts renderers/web/pdf/test/host-probe.test.ts
      # The supervisor against the real API and PostgreSQL: claim, fetch through the API, render confined, upload, settle;
      # and a design's capture the same way, gated, inspected and published (SDD-01-RF-0004).
      - run: node --test --test-concurrency=1 --test-timeout=180000 tests/integration/render-supervisor.test.mjs tests/integration/design-capture-supervisor.test.mjs

  database:
    name: SQL, persistence and API on PostgreSQL 16
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_PASSWORD: ci
        ports: ['5432:5432']
        options: >-
          --health-cmd "pg_isready -U postgres"
          --health-interval 5s --health-timeout 5s --health-retries 10
    env:
      SOPHIA_DISPOSABLE_DATABASE_URL: postgres://postgres:ci@localhost:5432/postgres
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0 (reads packageManager)
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version-file: .node-version
      - run: pnpm install --frozen-lockfile
      # The pack's migrations and SQL test as imported, then this repository's migrations and the same test.
      - run: pnpm test:sql --source pack
      - run: pnpm test:sql
      # Two-connection races, lease fencing, idempotent retries, SSE and revocation over real HTTP.
      - run: pnpm test:db
      # S1-05A crossing: the real pinned dsh runtime against the real API, PostgreSQL and worker dispatch; and CON-01's
      # service-mode replies on the same path, the context recorded by the worker with the dispatcher never paused,
      # against a local provider double (no credential or provider call). One file at a time.
      - run: pnpm build && pnpm artifacts
      - run: >-
          node --test --test-concurrency=1 --test-timeout=180000 tests/integration/runtime-service.test.mjs
          tests/integration/conversation-service.test.mjs
      # Q13's exclusive admission and install groups, which the shared service above cannot qualify (they skip there):
      # a PostgreSQL 16 cluster of their own, made in this service's image with no network, as its postgres user, the
      # repository and this Node read-only. Its census, version and stages are printed; a skip or a missing stage fails.
      # Then D-Q13's trusted-creator group on a second such cluster, whose postgres is a plain installer, as on Supabase.
      - run: scripts/q13-owned-pg16.sh '${{ job.services.postgres.id }}'
        timeout-minutes: 6

  room-media:
    name: Media bridge against a real LiveKit server
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0 (reads packageManager)
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version-file: .node-version
      - run: pnpm install --frozen-lockfile
      # S1-05A: the pinned livekit-server image in Docker, real rtc-node participants; no Google, no paid key.
      - run: pnpm test:livekit

  supabase-live:
    name: Live auth on local Supabase
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0 (reads packageManager)
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version-file: .node-version
      - run: pnpm install --frozen-lockfile
      # Supabase in Docker: ES256 signing key, db/migrations through the ledger runner, the API login.
      - run: pnpm supabase:local
      # Real GoTrue tokens verified through JWKS; tampered, legacy HS256 and publishable-key tokens rejected.
      - run: pnpm test:supabase

  studio-browser-part:
    name: The room in Chromium, part ${{ matrix.part }} of 3
    runs-on: ubuntu-24.04
    # The suite alone ran 29.1 minutes on 2026-10-07 (857 checks): 30 cut it off after its last check passed. On
    # 2026-10-12 the UI kit's stack (about 1,320 checks) was cut off at 45 minutes after 1,287: 60 leaves it room.
    # On 2026-10-16 the 1,714-check suite was cut off at 60 minutes before its end: 90. On 2026-10-19 about 2,250 checks
    # took 1.1 hours and some heads were cut off at 90 while still passing; the 2,180-check suite was cut off at 90
    # minutes after 2,002 (#468, run 39250730413), and CIROOMLIMIT's handoff said to shard instead of raising the limit
    # again. So the suite runs as three parts side by side, each on the same runner and under the same 90-minute bound,
    # with the same tests, default workers, per-test bounds, assertions and retries; no part cancels another.
    # Playwright's --shard splits every listed case of both projects (fullyParallel) into three disjoint parts whose
    # union is the whole list; a new case lands in some part with no list to keep.
    timeout-minutes: 90
    strategy:
      fail-fast: false
      matrix:
        part: [1, 2, 3]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0 (reads packageManager)
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version-file: .node-version
      - run: pnpm install --frozen-lockfile
      - run: pnpm --filter @sophia/studio exec playwright install --with-deps chromium
      # LFE-00's preservation checks: the real Studio components over labelled fixture data, no API, call or provider.
      - run: pnpm --filter @sophia/studio test:browser --shard=${{ matrix.part }}/3

  # The room's one check, under its existing name: it passes only when every part ran and passed. A part that failed,
  # was cancelled or timed out, or never ran (skipped) fails it; it runs even then (always()), so it is never absent.
  studio-browser:
    name: The room in Chromium, on its fixture page
    needs: studio-browser-part
    if: always()
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - env:
          PARTS: ${{ needs.studio-browser-part.result }}
        run: |
          echo "The room's three parts: $PARTS"
          test "$PARTS" = success
