# WBC-02 (WBC-02-CC-0013, accepted with WBC-02-CX-0032; isolated by CX-0035): qualifies the private Paperclip
# service's image on this repository's existing GitHub-hosted runner. It builds the pin's own build stage and Sophia's
# wrapper (deploy/paperclip/Dockerfile) for linux/amd64 from the exact candidate head, checks the image's identity and
# packaged files, runs it under a 2 GiB memory cgroup without swap with a disposable database and home and synthetic
# credentials, drives the installed plugin's flow through the service probe's --url mode, restarts and recreates it,
# and writes a credential-free receipt to the run summary. No secret, no registry, no push, no deployment: this is
# development CI, not Render's platform fit, not a registry digest and not a real Sophia (its address is closed).
name: paperclip-image

on:
  workflow_dispatch:
  pull_request:
    paths:
      - .github/workflows/paperclip-image.yml
      - deploy/paperclip/**
      - packages/coordination/**
      - packages/paperclip-adapters/**
      - packages/paperclip-plugin/**
      - scripts/paperclip-*.mjs

permissions:
  contents: read

concurrency:
  group: paperclip-image-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

env:
  PAPERCLIP_PIN: 5edf55d7350c7f08c9dd132c7e0f1421fa0bf2fb
  # The candidate itself, never the pull request's merge commit.
  CANDIDATE: ${{ github.event.pull_request.head.sha || github.sha }}
  IMAGE: sophia-paperclip:candidate

jobs:
  image:
    name: Paperclip image under a 2 GiB cgroup
    runs-on: ubuntu-24.04
    timeout-minutes: 120
    services:
      # For scripts/paperclip-verify.mjs (the built worker under the pin's harness), as the database job has it.
      postgres:
        image: postgres:16
        env:
          POSTGRES_PASSWORD: ci
        ports: ['5432:5432']
        options: >-
          --health-cmd "pg_isready -U postgres"
          --health-interval 5s --health-timeout 5s --health-retries 10
    steps:
      - name: Runner, disk and the space the build needs
        timeout-minutes: 10
        run: |
          E="$RUNNER_TEMP/evidence"; mkdir -p "$E"; echo "EVIDENCE=$E" >> "$GITHUB_ENV"
          disk() { df -B1 --output=avail,size / | tail -1 | awk -v l="$1" '{printf "{\"label\":\"%s\",\"availBytes\":%s,\"sizeBytes\":%s}\n", l, $1, $2}' >> "$E/disk.jsonl"; }
          disk start
          # Toolchains this job never uses; the build stage, the wrapper and the pin's install need the room.
          sudo rm -rf /usr/share/dotnet /usr/local/lib/android /opt/ghc /opt/hostedtoolcache/CodeQL
          disk freed
          jq -n --arg candidate "$CANDIDATE" --arg pin "$PAPERCLIP_PIN" --arg run "$GITHUB_SERVER_URL/$GITHUB_REPOSITORY/actions/runs/$GITHUB_RUN_ID" \
            --arg attempt "$GITHUB_RUN_ATTEMPT" --arg os "$(. /etc/os-release && echo "$PRETTY_NAME")" --arg kernel "$(uname -r)" \
            --arg arch "$(uname -m)" --argjson cpus "$(nproc)" --argjson memKiB "$(awk '/MemTotal/ {print $2}' /proc/meminfo)" \
            --arg cgroup "$(stat -fc %T /sys/fs/cgroup)" --arg docker "$(docker version --format '{{.Server.Version}}')" \
            '{candidate: $candidate, pin: $pin, run: $run, attempt: $attempt, runner: {os: $os, kernel: $kernel, arch: $arch, cpus: $cpus, memKiB: $memKiB, cgroupFs: $cgroup, docker: $docker}}' \
            > "$E/context.json"
          avail=$(df -B1 --output=avail / | tail -1 | tr -d " ")
          if [ "$avail" -lt $((25 * 1024 * 1024 * 1024)) ]; then echo "::error::only $avail bytes free; the build needs 25 GB to start"; exit 1; fi

      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ env.CANDIDATE }}
          path: sophia
          persist-credentials: false

      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          repository: paperclipai/paperclip
          ref: ${{ env.PAPERCLIP_PIN }}
          path: paperclip
          persist-credentials: false

      - name: The exact candidate, a clean tree, and the pin
        timeout-minutes: 2
        run: |
          test "$(git -C sophia rev-parse HEAD)" = "$CANDIDATE"
          test -z "$(git -C sophia status --porcelain)"
          test "$(git -C paperclip rev-parse HEAD)" = "$PAPERCLIP_PIN"

      # From the pristine checkout, before anything is installed or built in it.
      - name: The pin's own build stage
        timeout-minutes: 75
        run: |
          docker buildx build --platform linux/amd64 --target build --build-arg "PAPERCLIP_BUILD_COMMIT=$PAPERCLIP_PIN" \
            --load -t paperclip-build:5edf55d paperclip
          df -B1 --output=avail,size / | tail -1 | awk '{printf "{\"label\":\"after build stage\",\"availBytes\":%s,\"sizeBytes\":%s}\n", $1, $2}' >> "$EVIDENCE/disk.jsonl"

      - uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0 (reads packageManager)
        with:
          package_json_file: sophia/package.json
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version-file: sophia/.node-version

      - name: Install Sophia, and the pin for the packages' build
        timeout-minutes: 20
        run: |
          (cd sophia && pnpm install --frozen-lockfile)
          # The pin's own package manager; its SDK and db packages, whose types and validators the build and verify read.
          (cd paperclip && npx --yes pnpm@9.15.4 install --frozen-lockfile \
            && npx --yes pnpm@9.15.4 --filter @paperclipai/plugin-sdk build \
            && npx --yes pnpm@9.15.4 --filter @paperclipai/db build)

      - name: Sophia's build context, verified under the pin's harness
        timeout-minutes: 15
        env:
          SOPHIA_DISPOSABLE_DATABASE_URL: postgres://postgres:ci@localhost:5432/postgres
        run: |
          node sophia/scripts/paperclip-build.mjs --paperclip "$GITHUB_WORKSPACE/paperclip" --out "$RUNNER_TEMP/sophia-paperclip"
          jq -e --arg c "$CANDIDATE" --arg p "$PAPERCLIP_PIN" '.sophiaTreeDirty == false and .sophiaCommit == $c and .paperclipPin == $p' \
            "$RUNNER_TEMP/sophia-paperclip/MANIFEST.json"
          node sophia/scripts/paperclip-verify.mjs --paperclip "$GITHUB_WORKSPACE/paperclip" --dist "$RUNNER_TEMP/sophia-paperclip"

      - name: The image
        timeout-minutes: 20
        run: |
          docker buildx build --platform linux/amd64 --build-arg PAPERCLIP_BUILD_IMAGE=paperclip-build:5edf55d \
            --provenance=false --load -t "$IMAGE" "$RUNNER_TEMP/sophia-paperclip"
          df -B1 --output=avail,size / | tail -1 | awk '{printf "{\"label\":\"after image\",\"availBytes\":%s,\"sizeBytes\":%s}\n", $1, $2}' >> "$EVIDENCE/disk.jsonl"

      - name: The image's identity and packaged files
        timeout-minutes: 5
        run: |
          inspect() { docker image inspect "$1" --format '{{json .}}' | jq '{id: .Id, size: .Size, os: .Os, architecture: .Architecture}'; }
          M="$RUNNER_TEMP/sophia-paperclip/MANIFEST.json"
          docker run --rm --network none --entrypoint node "$IMAGE" /opt/sophia/verify-manifest.mjs /opt/sophia "$PAPERCLIP_PIN" && vm=true || vm=false
          docker run --rm --network none --entrypoint cat "$IMAGE" /opt/sophia/MANIFEST.json > "$RUNNER_TEMP/image-manifest.json"
          cmp -s "$RUNNER_TEMP/image-manifest.json" "$M" && mm=true || mm=false
          jq -n --argjson build "$(inspect paperclip-build:5edf55d)" --argjson image "$(inspect "$IMAGE")" \
            --argjson vm "$vm" --argjson mm "$mm" --arg sha "$(sha256sum "$M" | cut -c1-64)" --slurpfile m "$M" \
            --arg c "$CANDIDATE" --arg p "$PAPERCLIP_PIN" \
            '{pin: $m[0].paperclipPin, pinMatches: ($m[0].paperclipPin == $p), sophiaCommit: $m[0].sophiaCommit,
              sophiaCommitMatches: ($m[0].sophiaCommit == $c), sophiaTreeDirty: $m[0].sophiaTreeDirty,
              manifestSha256: $sha, manifestMatches: $mm, verifyManifestInImage: $vm, buildImage: $build, image: $image}' \
            > "$EVIDENCE/identity.json"
          jq -e '.pinMatches and .sophiaCommitMatches and .sophiaTreeDirty == false and .manifestMatches and .verifyManifestInImage
            and .image.os == "linux" and .image.architecture == "amd64"' "$EVIDENCE/identity.json"

      - name: Synthetic credentials, a disposable database and home
        timeout-minutes: 3
        run: |
          # Each value is generated here, masked before any use, and handed to later steps through GITHUB_ENV only.
          for name in PCDB_PASSWORD BETTER_AUTH_SECRET PAPERCLIP_SECRETS_MASTER_KEY PAPERCLIP_TOOL_ACTION_SIGNING_SECRET \
            PAPERCLIP_DECISION_SIGNING_SECRET SOPHIA_COORDINATION_TOKEN; do
            v="$(openssl rand -hex 32)"; echo "::add-mask::$v"; echo "$name=$v" >> "$GITHUB_ENV"
            if [ "$name" = PCDB_PASSWORD ]; then pw="$v"; fi
          done
          url="postgres://paperclip:$pw@pcdb:5432/paperclip"; echo "::add-mask::$url"; echo "DATABASE_URL=$url" >> "$GITHUB_ENV"
          docker network create pcnet
          docker volume create pchome
          POSTGRES_PASSWORD="$pw" docker run --detach --name pcdb --network pcnet --memory=1g \
            --env POSTGRES_USER=paperclip --env POSTGRES_DB=paperclip --env POSTGRES_PASSWORD postgres:16
          for _ in $(seq 1 30); do docker exec pcdb pg_isready -U paperclip -d paperclip -q && exit 0; sleep 2; done
          echo "::error::the disposable database was not ready within 60 s"; exit 1

      - name: First start, the installed plugin's flow, idle
        timeout-minutes: 20
        run: |
          node sophia/scripts/paperclip-image-container.mjs start first
          node sophia/scripts/paperclip-image-cgroup.mjs pc first:healthy "$EVIDENCE/cgroup.jsonl"
          timeout 660 node sophia/scripts/paperclip-service-probe.mjs --url http://127.0.0.1:3100 --phase first \
            --state "$RUNNER_TEMP/probe-state.json" --out "$EVIDENCE/probe-first.json" --wait-ms 300000 --deadline-ms 600000
          node sophia/scripts/paperclip-image-cgroup.mjs pc first:after-flow "$EVIDENCE/cgroup.jsonl"
          node sophia/scripts/paperclip-image-home.mjs snapshot pc "$EVIDENCE/home-before.json"
          sleep 60
          node sophia/scripts/paperclip-image-cgroup.mjs pc first:idle "$EVIDENCE/cgroup.jsonl"

      - name: Restart
        timeout-minutes: 8
        run: |
          node sophia/scripts/paperclip-image-container.mjs restart restart
          node sophia/scripts/paperclip-image-cgroup.mjs pc restart:healthy "$EVIDENCE/cgroup.jsonl"

      - name: Recreate on the same volume and database, sign-up closed
        timeout-minutes: 20
        run: |
          node sophia/scripts/paperclip-image-container.mjs remove
          node sophia/scripts/paperclip-image-container.mjs start recreated signup-closed
          node sophia/scripts/paperclip-image-cgroup.mjs pc recreated:healthy "$EVIDENCE/cgroup.jsonl"
          timeout 660 node sophia/scripts/paperclip-service-probe.mjs --url http://127.0.0.1:3100 --phase restarted \
            --state "$RUNNER_TEMP/probe-state.json" --out "$EVIDENCE/probe-restarted.json" --wait-ms 300000 --deadline-ms 600000
          node sophia/scripts/paperclip-image-cgroup.mjs pc recreated:after-flow "$EVIDENCE/cgroup.jsonl"
          node sophia/scripts/paperclip-image-home.mjs snapshot pc "$EVIDENCE/home-after.json"
          node sophia/scripts/paperclip-image-home.mjs compare "$EVIDENCE/home-before.json" "$EVIDENCE/home-after.json" "$EVIDENCE/home-compare.json"
          sleep 60
          node sophia/scripts/paperclip-image-cgroup.mjs pc recreated:idle "$EVIDENCE/cgroup.jsonl"

      - name: Redacted diagnostics
        if: always()
        timeout-minutes: 5
        run: |
          [ -f sophia/scripts/paperclip-image-container.mjs ] && [ -n "${EVIDENCE:-}" ] || exit 0
          node sophia/scripts/paperclip-image-container.mjs diagnostics "$EVIDENCE/diagnostics" || true
          tail -n 60 "$EVIDENCE/diagnostics/pc-logs.txt" 2>/dev/null || true

      - name: Receipt
        if: always()
        timeout-minutes: 3
        run: |
          [ -f sophia/scripts/paperclip-image-receipt.mjs ] && [ -n "${EVIDENCE:-}" ] || exit 0
          node sophia/scripts/paperclip-image-receipt.mjs "$EVIDENCE" "$EVIDENCE/receipt.json" "$EVIDENCE/summary.md"
          cat "$EVIDENCE/summary.md" >> "$GITHUB_STEP_SUMMARY"
          { echo; echo '<details><summary>receipt.json</summary>'; echo; echo '```json'; cat "$EVIDENCE/receipt.json"; echo '```'; echo '</details>'; } >> "$GITHUB_STEP_SUMMARY"
          cat "$EVIDENCE/receipt.json"
          jq -e '.verdict == "qualified"' "$EVIDENCE/receipt.json"

      - name: Clean up
        if: always()
        timeout-minutes: 3
        run: |
          docker rm --force pc pcdb 2>/dev/null || true
          docker volume rm pchome 2>/dev/null || true
          docker network rm pcnet 2>/dev/null || true
          rm -f "$RUNNER_TEMP/probe-state.json"
