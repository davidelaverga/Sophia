name: Experimental UML fixture

on:
  push:
    branches: [codex/render-uml-qualification]
    paths: ['renderers/web/pdf/**', '.github/workflows/uml-fixture.yml']

permissions:
  contents: read

jobs:
  fixture:
    runs-on: ubuntu-24.04
    # Two reader images and four separately bounded fixtures share this job.
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Verify driver, settlement and owned affinity controls
        run: python3 -m unittest discover -s renderers/web/pdf/uml -p 'test_*.py'
      - name: Build exact fixture image
        run: docker build --platform linux/amd64 --target fixture -f renderers/web/pdf/uml/Dockerfile -t sophia-uml-fixture .
      - name: Build preceding readers with the same candidate kernel and driver
        run: |
          baseline=4eb223e67d428c2473d07ccc2ad1912142c87b45
          git fetch --no-tags --depth=1 origin "$baseline"
          control=$(mktemp -d)
          trap 'rm -rf "$control"' EXIT
          git archive HEAD | tar -x -C "$control"
          # Only these three reader modules differ; all other candidate inputs match.
          for file in capture-page.mjs capture-html.mjs placement.mjs; do
            path="renderers/web/pdf/$file"
            git show "$baseline:$path" > "$control/$path"
            sha256sum "$path" "$control/$path"
          done
          printf 'UML_READER_CONTROL_SOURCE %s\n' "$baseline"
          docker build --platform linux/amd64 --target fixture -f "$control/renderers/web/pdf/uml/Dockerfile" -t sophia-uml-reader-control "$control"
      # The existing renderer CI requires this same runner-only namespace setting.
      # The browser sandbox, host Landlock and inherited seccomp remain active.
      - name: Allow the fixture's unprivileged namespaces
        run: |
          if [ -e /proc/sys/kernel/apparmor_restrict_unprivileged_userns ]; then
            sudo sysctl -w kernel.apparmor_restrict_unprivileged_userns=0
          fi
      - name: Compare fresh full fixtures on the same single CPU host
        run: |
          failed=0
          # ABBA order balances position; each container has a fresh one-run latch.
          for trial in baseline-1 optimized-1 optimized-2 baseline-2; do
            image=sophia-uml-reader-control
            if [[ "$trial" == optimized-* ]]; then image=sophia-uml-fixture; fi
            printf 'UML_COMPARISON_TRIAL %s %s\n' "$trial" "$image"
            if timeout --kill-after=5s 300s docker run --rm --cpus=1 --memory=2g \
              --cap-drop=ALL --cap-add=CHOWN --cap-add=DAC_OVERRIDE --cap-add=FOWNER \
              --cap-add=SETUID --cap-add=SETGID --cap-add=SYS_CHROOT \
              --security-opt=no-new-privileges --security-opt=seccomp=unconfined \
              --network=none "$image" python3 /opt/uml/ci-once.py > "uml-fixture-$trial.log" 2>&1; then
              printf 'UML_COMPARISON_EXIT %s 0\n' "$trial"
            else
              status=$?
              printf 'UML_COMPARISON_EXIT %s %s\n' "$trial" "$status"
              failed=1
            fi
          done
          exit "$failed"
      # The outer Docker filter is absent here just as on the Render worker; the
      # unchanged host launcher installs its own filter before the UML kernel.
      - name: Preserve synthetic diagnostic evidence
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: uml-fixture-${{ github.sha }}
          path: uml-fixture-*.log
          retention-days: 7
          if-no-files-found: ignore
