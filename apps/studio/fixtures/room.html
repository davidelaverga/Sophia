<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="color-scheme" content="dark" />
    <title>Room fixture · Sophia Studio</title>
    <style>
      .fixture-label {
        position: fixed;
        top: 0;
        left: 50%;
        transform: translateX(-50%);
        margin: 0;
        padding: 2px 8px;
        z-index: 1000;
        font:
          11px/1.4 system-ui,
          sans-serif;
        color: #000;
        background: #ffd400;
        border-radius: 0 0 4px 4px;
        pointer-events: none;
      }
      /* The demo's label sits in the corner, clear of the app's bar and its controls. */
      .fixture-label[data-demo] {
        top: auto;
        bottom: 12px;
        left: 12px;
        transform: none;
        border-radius: 4px;
      }
      /* On a phone, above the room's dock and the composer's bar. */
      @media (max-width: 600px) {
        .fixture-label[data-demo] {
          bottom: 84px;
        }
        /* A conversation's field fills a phone's foot: there, the label steps away (C9). */
        body:has(.conv-compose) .fixture-label[data-demo] {
          display: none;
        }
      }
    </style>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="./room.tsx"></script>
  </body>
</html>
