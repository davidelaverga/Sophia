    <!--
      The opening (docs/plans/entry-opening.md), once, on the way in: from signing in to the app, while it gets ready.
      Every load paints Sophia's void at once; a sign-in's return (public/entry.js) also shows her lockup from the
      first frame. Its own small files: the CSP admits no inline style or script. src/app/entry.ts moves its bar on
      real milestones and hands off to the app.
    -->
    <script src="/entry.js"></script>
    <link rel="stylesheet" href="/entry.css" />
  </head>

      docs/plans/signed-in-early.md): its own script, so it never waits on the app's modules and first render. A build

    -->
